name: CI Workflow (python)

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.11'
      working-directory:
        description: 'Working directory for commands'
        required: false
        type: string
        default: '.'
      run-lint:
        description: 'Run linting'
        required: false
        type: boolean
        default: true
      run-test:
        description: 'Run tests with pytest'
        required: false
        type: boolean
        default: true
      ref:
        description: 'The branch, tag or SHA to checkout'
        required: false
        type: string

defaults:
  run:
    shell: bash

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python Environment
        uses: zmihai/.github/actions/setup-python-env@v0.9.4
        with:
          python-version: ${{ inputs.python-version }}
          working-directory: ${{ inputs.working-directory }}
          install-dependencies: 'true'

      - name: Run linting with flake8
        if: ${{ inputs.run-lint }}
        run: |
          pip install flake8
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests with pytest
        if: ${{ inputs.run-test }}
        run: |
          pip install pytest
          # Best-effort install of project-defined test deps:
          # 1. requirements-dev.txt (plain pip-style projects)
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi
          # 2. pyproject.toml [project.optional-dependencies].dev extras
          # Parse the file to confirm a `dev` extra is actually defined, so a
          # missing extra surfaces as a real install error instead of being
          # silently swallowed. Uses tomllib on Python 3.11+; falls back to
          # installing `tomli` on demand for older interpreters so older
          # consumers of this reusable workflow still get correct detection.
          if [ -f pyproject.toml ] && python - <<'PY'
          import subprocess
          import sys
          try:
              import tomllib  # Python 3.11+
          except ModuleNotFoundError:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "tomli"])
              import tomli as tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          extras = data.get("project", {}).get("optional-dependencies", {})
          raise SystemExit(0 if "dev" in extras else 1)
          PY
          then
            pip install ".[dev]"
          fi
          pytest
