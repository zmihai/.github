name: '🔀 Reusable Gemini Dispatch'

on:
  workflow_call:
    inputs:
      projects:
        description: 'JSON list of projects with their language, version, directory, and outcomes.'
        required: true
        type: string
        default: '[]'

      ref:
        description: 'The branch, tag or SHA to checkout'
        required: false
        type: string

    secrets:
      GEMINI_API_KEY:
        description: 'Required for calling the Gemini API'
        required: true
      CALLER_GITHUB_TOKEN:
        description: 'Required for the workflow to update PRs'
        required: true

defaults:
  run:
    shell: 'bash'

jobs:
  debugger:
    if: |-
      ${{ fromJSON(vars.DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    steps:
      - name: 'Print context for debugging'
        env:
          DEBUG_event_name: '${{ github.event_name }}'
          DEBUG_event__action: '${{ github.event.action }}'
          DEBUG_event__comment__author_association: '${{ github.event.comment.author_association }}'
          DEBUG_event__issue__author_association: '${{ github.event.issue.author_association }}'
          DEBUG_event__pull_request__author_association: '${{ github.event.pull_request.author_association }}'
          DEBUG_event__review__author_association: '${{ github.event.review.author_association }}'
          DEBUG_event: '${{ toJSON(github.event) }}'
        run: |-
          env | grep '^DEBUG_'


  dispatch:
    # For PRs: only if not from a fork
    # For issues: only on open/reopen
    # For comments: only if user types @gemini-cli and is OWNER/MEMBER/COLLABORATOR
    if: |-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.fork == false
      ) || (
        github.event_name == 'issues' &&
        contains(fromJSON('["opened", "reopened"]'), github.event.action)
      ) || (
        github.event.sender.type == 'User' &&
        startsWith(github.event.comment.body || github.event.review.body || github.event.issue.body, '@gemini-cli') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
      )
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    outputs:
      command: '${{ steps.extract_command.outputs.command }}'
      request: '${{ steps.extract_command.outputs.request }}'
      additional_context: '${{ steps.extract_command.outputs.additional_context }}'
      issue_number: '${{ github.event.pull_request.number || github.event.issue.number }}'
      projects: '${{ inputs.projects }}'
      resolved_ref: '${{ steps.extract_command.outputs.resolved_ref }}'
      is_fork: '${{ steps.extract_command.outputs.is_fork }}'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Extract command and resolve ref'
        id: 'extract_command'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd' # ratchet:actions/github-script@v8
        env:
          EVENT_TYPE: '${{ github.event_name }}.${{ github.event.action }}'
          REQUEST: '${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}'
          ACTOR: '${{ github.actor }}'
          INPUT_REF: '${{ inputs.ref }}'
        with:
          github-token: '${{ steps.mint_identity_token.outputs.token || secrets.CALLER_GITHUB_TOKEN || secrets.GITHUB_TOKEN || github.token }}'
          script: |
            const eventType = process.env.EVENT_TYPE;
            const request = process.env.REQUEST;
            const actor = process.env.ACTOR;
            const inputRef = process.env.INPUT_REF;
            let additionalContext = '';
            core.setOutput('request', request);

            // 1. Resolve Command
            let command = 'fallthrough';
            if (eventType.startsWith("pull_request.")) {
              if (actor === 'dependabot[bot]') {
                command = 'review-and-merge';
              } else {
                command = 'review';
              }
            } else if (request.startsWith("@gemini-cli /review")) {
              if (request.startsWith("@gemini-cli /review-and-merge")) {
                command = 'review-and-merge';
                additionalContext = request.replace(/^@gemini-cli \/review-and-merge/, '').trim();
              } else {
                command = 'review';
                additionalContext = request.replace(/^@gemini-cli \/review/, '').trim();
              }
              core.setOutput('additional_context', additionalContext);
            } else if (request.startsWith("@gemini-cli /merge")) {
              command = 'merge';
            }

            // 2. Resolve Ref and Fork Status
            let resolvedRef = inputRef || context.payload.pull_request?.head?.sha || context.sha;
            let isFork = 'false'; // Default false unless proven it's a fork

            if (context.payload.pull_request) {
               isFork = context.payload.pull_request.head.repo.fork ? 'true' : 'false';
            } else if (context.payload.issue?.pull_request) {
               const issueNumber = context.payload.issue.number;
               try {
                 const { data: pr } = await github.rest.pulls.get({
                   owner: context.repo.owner,
                   repo: context.repo.repo,
                   pull_number: issueNumber,
                 });
                 if (!inputRef) {
                   resolvedRef = pr.head.sha;
                   console.log(`Resolved PR head SHA: ${resolvedRef}`);
                 }
                 isFork = pr.head.repo.fork ? 'true' : 'false';
               } catch (e) {
                 console.log(`Could not fetch PR data for issue ${issueNumber}. Failing closed by assuming it is a fork.`);
                 isFork = 'true'; // Fail closed: set to true if fetch fails to prevent secret exposure
               }
            }

            if (isFork === 'true' && command !== 'fallthrough') {
               command = 'unsupported-fork';
            }

            core.setOutput('command', command);
            core.setOutput('is_fork', isFork);
            core.setOutput('resolved_ref', resolvedRef);

      - name: 'Acknowledge request'
        if: ${{ steps.extract_command.outputs.command != 'fallthrough' && steps.extract_command.outputs.command != 'unsupported-fork' }}
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.CALLER_GITHUB_TOKEN || secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          MESSAGE: |-
            🤖 Hi @${{ github.actor }}, I've received your request, and I'm working on it now! You can track my progress [in the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details.
          REPOSITORY: '${{ github.repository }}'
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "${MESSAGE}" \
            --repo "${REPOSITORY}"

      - name: 'Acknowledge unsupported fork'
        if: ${{ steps.extract_command.outputs.command == 'unsupported-fork' }}
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.CALLER_GITHUB_TOKEN || secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          MESSAGE: |-
            🤖 Hi @${{ github.actor }}, unfortunately, fork PRs are not supported by the Gemini CLI workflows.
          REPOSITORY: '${{ github.repository }}'
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "${MESSAGE}" \
            --repo "${REPOSITORY}"


  review:
    needs: 'dispatch'
    if: |-
      ${{ needs.dispatch.outputs.command == 'review' || needs.dispatch.outputs.command == 'review-and-merge' }}
    uses: './.github/workflows/gemini-review.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
      command: '${{ needs.dispatch.outputs.command }}'
      issue_number: '${{ needs.dispatch.outputs.issue_number }}'
      is_fork: '${{ needs.dispatch.outputs.is_fork }}'
      projects: '${{ needs.dispatch.outputs.projects }}'
      ref: ${{ needs.dispatch.outputs.resolved_ref }}
    secrets: 'inherit'

  merge:
    needs:
      - 'dispatch'
      - 'review'
    if: |-
      ${{ needs.dispatch.outputs.command == 'merge' || needs.review.outputs.command == 'review-and-merge' }}
    uses: './.github/workflows/gemini-merge.yml'
    permissions:
      security-events: 'write'
      contents: 'write'
      actions: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
      pull_request_number: '${{ needs.dispatch.outputs.issue_number }}'
      is_fork: '${{ needs.dispatch.outputs.is_fork }}'
      review_summary: '${{ needs.review.outputs.review_summary }}'
      projects: '${{ needs.dispatch.outputs.projects }}'
      ref: ${{ needs.dispatch.outputs.resolved_ref }}
    secrets: 'inherit'

  fallthrough:
    needs:
      - 'dispatch'
      - 'review'
      - 'merge'
    if: |-
      ${{ always() && !cancelled() && (failure() || needs.dispatch.outputs.command == 'fallthrough') }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Send failure comment'
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.CALLER_GITHUB_TOKEN || secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          MESSAGE: |-
            🤖 I'm sorry @${{ github.actor }}, but I was unable to process your request. Please [see the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details.
          REPOSITORY: '${{ github.repository }}'
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "${MESSAGE}" \
            --repo "${REPOSITORY}"
