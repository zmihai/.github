name: '🔀 Reusable Gemini Dispatch'

on:
  workflow_call:
    inputs:
      projects:
        description: 'JSON list of projects with their language, version, directory, and outcomes.'
        required: true
        type: string
        default: '[]'

      ref:
        description: 'The branch, tag or SHA to checkout'
        required: false
        type: string

    secrets:
      GEMINI_API_KEY:
        description: 'Required for calling the Gemini API'
        required: true
      CALLER_GITHUB_TOKEN:
        description: 'Required for the workflow to update PRs'
        required: true

defaults:
  run:
    shell: 'bash'

jobs:
  debugger:
    if: |-
      ${{ fromJSON(vars.DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    steps:
      - name: 'Print context for debugging'
        env:
          DEBUG_event_name: '${{ github.event_name }}'
          DEBUG_event__action: '${{ github.event.action }}'
          DEBUG_event__comment__author_association: '${{ github.event.comment.author_association }}'
          DEBUG_event__issue__author_association: '${{ github.event.issue.author_association }}'
          DEBUG_event__pull_request__author_association: '${{ github.event.pull_request.author_association }}'
          DEBUG_event__review__author_association: '${{ github.event.review.author_association }}'
          DEBUG_event: '${{ toJSON(github.event) }}'
        run: |-
          env | grep '^DEBUG_'


  # The trigger policy (which events proceed, command extraction, ref/fork
  # resolution) lives in reusable-gemini-guard.yml so callers can run the
  # exact same gate before their own CI jobs.
  guard:
    uses: './.github/workflows/reusable-gemini-guard.yml'
    with:
      ref: '${{ inputs.ref }}'

  dispatch:
    needs: 'guard'
    if: |-
      ${{ needs.guard.outputs.proceed == 'true' }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    outputs:
      command: '${{ needs.guard.outputs.command }}'
      request: '${{ needs.guard.outputs.request }}'
      additional_context: '${{ needs.guard.outputs.additional_context }}'
      issue_number: '${{ github.event.pull_request.number || github.event.issue.number }}'
      projects: '${{ inputs.projects }}'
      resolved_ref: '${{ needs.guard.outputs.resolved_ref }}'
      is_fork: '${{ needs.guard.outputs.is_fork }}'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Acknowledge request'
        if: ${{ needs.guard.outputs.command != 'fallthrough' && needs.guard.outputs.command != 'unsupported-fork' }}
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.CALLER_GITHUB_TOKEN || secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          MESSAGE: |-
            🤖 Hi @${{ github.actor }}, I've received your request, and I'm working on it now! You can track my progress [in the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details.
          REPOSITORY: '${{ github.repository }}'
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "${MESSAGE}" \
            --repo "${REPOSITORY}"

      - name: 'Acknowledge unsupported fork'
        if: ${{ needs.guard.outputs.command == 'unsupported-fork' }}
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.CALLER_GITHUB_TOKEN || secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          MESSAGE: |-
            🤖 Hi @${{ github.actor }}, unfortunately, fork PRs are not supported by the Gemini CLI workflows.
          REPOSITORY: '${{ github.repository }}'
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "${MESSAGE}" \
            --repo "${REPOSITORY}"


  review:
    needs: 'dispatch'
    if: |-
      ${{ needs.dispatch.outputs.command == 'review' || needs.dispatch.outputs.command == 'review-and-merge' }}
    uses: './.github/workflows/gemini-review.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
      command: '${{ needs.dispatch.outputs.command }}'
      issue_number: '${{ needs.dispatch.outputs.issue_number }}'
      is_fork: '${{ needs.dispatch.outputs.is_fork }}'
      projects: '${{ needs.dispatch.outputs.projects }}'
      ref: ${{ needs.dispatch.outputs.resolved_ref }}
    secrets: 'inherit'

  merge:
    needs:
      - 'dispatch'
      - 'review'
    if: |-
      ${{ needs.dispatch.outputs.command == 'merge' || needs.review.outputs.command == 'review-and-merge' }}
    uses: './.github/workflows/gemini-merge.yml'
    permissions:
      security-events: 'write'
      contents: 'write'
      actions: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
      pull_request_number: '${{ needs.dispatch.outputs.issue_number }}'
      is_fork: '${{ needs.dispatch.outputs.is_fork }}'
      review_summary: '${{ needs.review.outputs.review_summary }}'
      projects: '${{ needs.dispatch.outputs.projects }}'
      ref: ${{ needs.dispatch.outputs.resolved_ref }}
    secrets: 'inherit'

  fallthrough:
    needs:
      - 'dispatch'
      - 'review'
      - 'merge'
    if: |-
      ${{ always() && !cancelled() && (failure() || needs.dispatch.outputs.command == 'fallthrough') }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Send failure comment'
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.CALLER_GITHUB_TOKEN || secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          MESSAGE: |-
            🤖 I'm sorry @${{ github.actor }}, but I was unable to process your request. Please [see the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details.
          REPOSITORY: '${{ github.repository }}'
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "${MESSAGE}" \
            --repo "${REPOSITORY}"
