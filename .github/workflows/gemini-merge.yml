name: '🧪🚀 Gemini Test & Merge'

on:
  workflow_call:
    inputs:
      pull_request_number:
        type: string
        description: 'The pull request number'
        required: true

      is_fork:
        type: string
        description: 'Whether the pull request is from a fork'
        required: false
        default: 'false'

      review_summary:
        description: 'The summary of the review step'
        required: false
        type: string
        default: ''

      additional_context:
        type: string
        description: 'Any additional context from the request'
        required: false
        default: ''

      projects:
        description: 'JSON list of projects'
        required: true
        type: string
        default: '[]'

      ref:
        description: 'The branch, tag or SHA to checkout'
        required: false
        type: string

# Deliberately no `concurrency` block here. Per-PR serialization of the whole
# guard -> dispatch -> review/merge pipeline comes from the caller workflow's
# per-PR concurrency group (see workflow-templates/gemini.yml), so two runs for
# the same PR never execute concurrently. A repo-wide merge group used to live
# here, but GitHub Actions keeps at most ONE pending run per group and silently
# cancels the rest, so simultaneous Dependabot PRs evicted each other's merge
# jobs and were left fully reviewed yet unmerged, with nothing to retry them.
# Cross-PR merge races are the accepted trade-off: a losing merge fails
# visibly, and Dependabot auto-rebases when the base branch moves, which
# triggers a fresh run.

defaults:
  run:
    shell: 'bash'

jobs:
  merge:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    permissions:
      contents: 'write'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'write'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Checkout repository'
        uses: 'actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd' # ratchet:actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: 'Resolve PR head ref'
        id: 'resolve_head_ref'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd' # ratchet:actions/github-script@v8
        env:
          INPUT_PR_NUMBER: '${{ inputs.pull_request_number }}'
        with:
          result-encoding: string
          script: |
            let headRef;
            // Prefer the head ref from the pull_request event payload when available.
            if (context.payload.pull_request) {
              headRef = context.payload.pull_request.head.ref;
            } else {
              // Fallback for issue_comment / pull_request_review_comment / etc. events,
              // where context.payload.pull_request is absent. We look the PR up via API.
              const prNumber = parseInt(process.env.INPUT_PR_NUMBER, 10);
              if (!prNumber) {
                throw new Error('pull_request_number input is required to resolve head_ref outside of pull_request events');
              }
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              headRef = pr.head.ref;
            }
            // Safety: head_ref is later substituted into a shell command by the merge agent
            // (`git push origin HEAD:refs/heads/<head_ref>`). Branch names are external input and git
            // permits shell metacharacters (e.g. `$`, backtick, `;`, `&`) in them, so reject anything
            // outside a conservative safe set before it can reach a shell that holds write credentials.
            if (!/^[A-Za-z0-9._\/-]+$/.test(headRef)) {
              throw new Error(`Refusing to proceed: PR head ref '${headRef}' contains characters outside [A-Za-z0-9._/-] and may be unsafe to use in a shell command.`);
            }
            return headRef;

      # The context file deliberately lives at the repository root, NOT under .gemini/: the Gemini
      # CLI's @{file} include resolves through the workspace file filter, which SILENTLY drops any
      # path matched by .gitignore or .geminiignore (verified in gemini-cli 0.46.0:
      # readPathFromWorkspace returns [] for ignored single files, and AtFileProcessor turns that
      # into "file was ignored ... and was not included in the prompt"). Several consumer repos
      # gitignore `.gemini/`, which used to strip the entire Input Data block from the merge prompt
      # without any error. The check-ignore guard fails loudly if the chosen path is ever ignored
      # (it does not evaluate .geminiignore — keep the context file out of any .geminiignore too).
      - name: 'Prepare prompt context'
        shell: 'bash'
        run: |-
          if git check-ignore -q "${CONTEXT_FILE}"; then
            echo "::error::'${CONTEXT_FILE}' is ignored by a .gitignore rule in this repository. The Gemini CLI silently drops gitignored @{} includes, so the merge agent would run without its Input Data. Remove the ignore rule or relocate the context file."
            exit 1
          fi
          mkdir -p .gemini
          jq -n \
            --arg repo "${REPOSITORY}" \
            --arg pr "${PULL_REQUEST_NUMBER}" \
            --arg issue_title "${ISSUE_TITLE}" \
            --arg issue_body "${ISSUE_BODY}" \
            --arg context "${ADDITIONAL_CONTEXT}" \
            --argjson projects "${PROJECTS:-[]}" \
            --arg review_summary "${REVIEW_SUMMARY}" \
            --arg head_ref "${HEAD_REF}" \
            '{repository: $repo, pull_request_number: $pr, issue_title: $issue_title, issue_body: $issue_body, additional_context: $context, projects: $projects, review_summary: $review_summary, head_ref: $head_ref}' > "${CONTEXT_FILE}"
        env:
          CONTEXT_FILE: '.gemini-context.json'
          REPOSITORY: '${{ github.repository }}'
          PULL_REQUEST_NUMBER: '${{ inputs.pull_request_number }}'
          ISSUE_TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          ISSUE_BODY: '${{ github.event.pull_request.body || github.event.issue.body }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
          PROJECTS: '${{ inputs.projects }}'
          REVIEW_SUMMARY: '${{ inputs.review_summary }}'
          HEAD_REF: '${{ steps.resolve_head_ref.outputs.result }}'

      # Snapshot the PR's decisive-review IDs and merged state just before the model runs, so the gate
      # below can detect outcomes produced by THIS merge job by identity rather than by timestamp.
      # Comparing IDs (not times) is immune to whole-second timestamp granularity and to clock skew
      # between the runner and the GitHub API, and it correctly excludes pre-existing reviews/merges and
      # the review submitted earlier in the same dispatch by the review job (which completes first).
      #
      # The step additionally computes `blocking_review`: whether the PR carries an ACTIVE
      # CHANGES_REQUESTED review (a reviewer whose most recent decisive review is CHANGES_REQUESTED
      # and has not been dismissed or superseded by their own later APPROVED). The merge prompt
      # already forbids merging over such a review, but that gate lived only in model compliance —
      # and the model has been observed merging past it. When `blocking_review` is true the merge
      # model is not invoked at all (a deterministic skip): the blocking review IS the durable
      # outcome, the author already has actionable feedback from the review job, and there is
      # nothing useful for the merge agent to add. The job stays green — a red here would make the
      # dispatch fallthrough post a spurious "failure" comment on every correctly-blocked PR.
      - name: 'Snapshot PR review state'
        id: 'pre_state'
        if: ${{ inputs.is_fork != 'true' }}
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd' # ratchet:actions/github-script@v8
        env:
          INPUT_PR_NUMBER: '${{ inputs.pull_request_number }}'
        with:
          github-token: '${{ steps.mint_identity_token.outputs.token || secrets.CALLER_GITHUB_TOKEN || secrets.GITHUB_TOKEN || github.token }}'
          script: |
            const prNumber = parseInt(process.env.INPUT_PR_NUMBER, 10);
            if (!prNumber) {
              core.setFailed('pull_request_number input is required to snapshot PR state');
              return;
            }
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: prNumber, per_page: 100,
            });
            const decisiveIds = reviews
              .filter(r => r.state === 'APPROVED' || r.state === 'CHANGES_REQUESTED')
              .map(r => r.id);
            // Active CHANGES_REQUESTED detection. GitHub review semantics: per reviewer, a later
            // APPROVED or CHANGES_REQUESTED supersedes their earlier one, and a dismissed review
            // flips to state DISMISSED. COMMENTED reviews never supersede anything. So a reviewer
            // blocks iff their LATEST review among {APPROVED, CHANGES_REQUESTED, DISMISSED} is
            // CHANGES_REQUESTED. listReviews is observed to return submission order, but that
            // ordering is not documented — sort by submitted_at (Array.prototype.sort is stable,
            // so same-second reviews keep their API order) instead of relying on it.
            const ordered = [...reviews].sort(
              (a, b) => new Date(a.submitted_at ?? 0) - new Date(b.submitted_at ?? 0)
            );
            const latestDecisiveByUser = new Map();
            for (const r of ordered) {
              if (r.state === 'APPROVED' || r.state === 'CHANGES_REQUESTED' || r.state === 'DISMISSED') {
                // Ghost/deleted reviewers can lack a login (or a user object entirely). Never
                // let unattributable reviews share one key — they must not supersede each other,
                // so key those by review id instead (conservative: an orphaned CHANGES_REQUESTED
                // keeps blocking until dismissed).
                const key = r.user?.login ?? (r.user?.id != null ? `id:${r.user.id}` : `review:${r.id}`);
                latestDecisiveByUser.set(key, r);
              }
            }
            const blocking = [...latestDecisiveByUser.values()].filter(r => r.state === 'CHANGES_REQUESTED');
            // Use merged_at (non-null when merged) as the merged indicator — reliably present on the
            // single-PR GET response.
            const isMerged = pr.merged_at != null;
            core.setOutput('was_merged', String(isMerged));
            core.setOutput('decisive_review_ids', JSON.stringify(decisiveIds));
            core.setOutput('blocking_review', String(blocking.length > 0));
            for (const r of blocking) {
              core.notice(`PR #${prNumber} has an active CHANGES_REQUESTED review by ${r.user?.login ?? '<unknown user>'} (review ${r.id}) — the merge model will not be invoked.`);
            }
            core.info(`Pre-run snapshot: merged=${isMerged}, decisive reviews=${decisiveIds.length}, blocking reviews=${blocking.length}`);

      # The Gemini CLI resolves /commands from the workspace's `.gemini/commands/` (plus
      # ~/.gemini/commands and extensions) — and it passes an UNRESOLVED /command through to the
      # model as literal prompt text, without any error. The workspace here is the CONSUMER repo,
      # which has no command files, so without this step /pr-merge does not exist and the model
      # runs with a one-line prompt instead of the merge policy in .github/commands/pr-merge.toml.
      # Delivery is via the install-gemini-commands composite action (token-free — a composite
      # action's repo files are materialized from the runner's action cache; see that action's
      # header for the mechanism); its release-pinned `uses:` ref keeps the prompts
      # version-matched to these workflows. Command names are deliberately distinct from
      # run-gemini-cli's bundled set (gemini-review, gemini-invoke, gemini-triage, ...): the
      # action copies its bundled files into `.gemini/commands/` AFTER this step and silently
      # overwrites same-named files.
      - name: 'Install repo Gemini commands'
        if: ${{ inputs.is_fork != 'true' && steps.pre_state.outputs.blocking_review != 'true' }}
        uses: 'zmihai/.github/actions/install-gemini-commands@v0.12.1'

      # Installed with `--consent` because run-gemini-cli's own installer cannot answer the Agent
      # Skills consent prompt — see the 'Pre-install code-review extension' step in
      # gemini-review.yml for the canonical rationale. The run-gemini-cli step below picks the
      # extension up from $HOME/.gemini — its `extensions:` input is intentionally NOT set
      # (re-installing there would re-prompt and fail again).
      - name: 'Pre-install code-review extension (non-interactive)'
        if: ${{ inputs.is_fork != 'true' && steps.pre_state.outputs.blocking_review != 'true' }}
        env:
          # Keep in sync with the `gemini_cli_version` passed to run-gemini-cli below (npm
          # versions/dist-tags only — see gemini-review.yml).
          GEMINI_CLI_VERSION: "${{ vars.GEMINI_CLI_VERSION || '0.46.0' }}"
        run: |-
          npx --yes "@google/gemini-cli@${GEMINI_CLI_VERSION}" extensions install --consent 'https://github.com/gemini-cli-extensions/code-review' </dev/null

      - name: 'Run Gemini pull request merge'
        if: ${{ inputs.is_fork != 'true' && steps.pre_state.outputs.blocking_review != 'true' }}
        uses: 'google-github-actions/run-gemini-cli@3ca2577f2714990269a7378904cf70ae1e01e288' # ratchet:google-github-actions/run-gemini-cli@main
        id: 'gemini_pr_merge'
        env:
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.CALLER_GITHUB_TOKEN || secrets.GITHUB_TOKEN || github.token }}'
          GEMINI_CLI_TRUST_WORKSPACE: '${{ inputs.is_fork != ''true'' && (github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository) }}'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          # Compatible with current Gemini CLI: the tools.core allowlist below explicitly
          # includes the MCP tool FQNs (mcp_github_*), which is required for the GitHub MCP
          # tools to be exposed to the model (verified on 0.42.0 through 0.46.0 — tools.core
          # acts as a global allowlist that also filters MCP tools, not just built-ins).
          # activate_skill is allowlisted because extension Agent Skills (the code-review
          # extension declares one) activate via that built-in tool; leaving it unlisted makes
          # the model burn turns on denied calls (run-gemini-cli issue #532).
          gemini_cli_version: "${{ vars.GEMINI_CLI_VERSION || '0.46.0' }}"
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: "${{ vars.GEMINI_MERGE_MODEL || vars.GEMINI_MODEL || 'gemini-flash-latest' }}"
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-merge'
          # Explicitly set the PR number to handle `issue_comment` triggers (which GitHub treats as issues, not PRs)
          github_pr_number: '${{ inputs.pull_request_number }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 100
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "pull_request_review_write",
                    "add_comment_to_pending_review",
                    "merge_pull_request",
                    "pull_request_read"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "run_shell_command",
                  "grep_search",
                  "list_directory",
                  "read_file",
                  "activate_skill",
                  "mcp_github_pull_request_review_write",
                  "mcp_github_add_comment_to_pending_review",
                  "mcp_github_merge_pull_request",
                  "mcp_github_pull_request_read"
                ]
              }
            }
          # review_summary is deliberately NOT passed as a prompt argument: arguments are appended
          # after the command template's final "## Arguments:" line, so a multi-line summary used to
          # occupy the highest-recency position in the prompt — in one observed run the security
          # section's closing "no findings were identified" outweighed both a High-severity code
          # review and failing CI, and the model merged. The summary now reaches the model only
          # through the Input Data context file (whose delivery the check-ignore guard above makes
          # deterministic).
          prompt: '/pr-merge --merge_strategy=squash --repository=${{ github.repository }} --pr=${{ inputs.pull_request_number }} --title=${{ github.event.pull_request.title || github.event.issue.title }} --projects="${{ inputs.projects }}"'

      # The Gemini CLI step reports "success" whenever the process exits 0, which happens even when the
      # model only narrates actions (e.g. "I merged the PR") without invoking the corresponding tools.
      # This gate asserts that THIS merge job left a DURABLE outcome on the PR: either the PR became
      # merged (and was not already merged before the run), or a NEW decisive review (APPROVED /
      # CHANGES_REQUESTED) appeared that was not present in the pre-run snapshot. Comparing against the
      # snapshot by review id excludes pre-existing reviews/merges and the review submitted earlier in
      # the same dispatch by the review job. A run that ends with only pending/comment activity is
      # treated as a failure so it surfaces red and triggers the dispatch fallthrough notification.
      - name: 'Verify durable merge outcome'
        if: ${{ success() && inputs.is_fork != 'true' && steps.pre_state.outputs.blocking_review != 'true' }}
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd' # ratchet:actions/github-script@v8
        env:
          INPUT_PR_NUMBER: '${{ inputs.pull_request_number }}'
          PRE_WAS_MERGED: '${{ steps.pre_state.outputs.was_merged }}'
          PRE_DECISIVE_REVIEW_IDS: '${{ steps.pre_state.outputs.decisive_review_ids }}'
        with:
          github-token: '${{ steps.mint_identity_token.outputs.token || secrets.CALLER_GITHUB_TOKEN || secrets.GITHUB_TOKEN || github.token }}'
          script: |
            const prNumber = parseInt(process.env.INPUT_PR_NUMBER, 10);
            if (!prNumber) {
              core.setFailed('pull_request_number input is required to verify the merge outcome');
              return;
            }
            const { owner, repo } = context.repo;

            // Outcomes present BEFORE the model ran do not count as produced by THIS run. Fail CLOSED if
            // the pre-run snapshot is missing or malformed: without a trustworthy snapshot we cannot tell
            // a new decisive review from a pre-existing one, and silently assuming "none" would let a
            // pre-existing review mask a no-op run (a false green) — the opposite of this gate's purpose.
            const wasMerged = process.env.PRE_WAS_MERGED === 'true';
            const rawPriorIds = process.env.PRE_DECISIVE_REVIEW_IDS;
            let priorIds;
            try {
              priorIds = JSON.parse(rawPriorIds);
            } catch (e) {
              core.setFailed(`Could not parse the pre-run review snapshot (PRE_DECISIVE_REVIEW_IDS=${JSON.stringify(rawPriorIds)}): ${e.message}. Failing closed so a missing snapshot cannot mask a no-op run.`);
              return;
            }
            if (!Array.isArray(priorIds)) {
              core.setFailed(`Pre-run review snapshot was not an array (got ${typeof priorIds}). Failing closed.`);
              return;
            }
            const priorDecisive = new Set(priorIds);

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const isMerged = pr.merged_at != null;
            if (isMerged && !wasMerged) {
              core.info(`PR #${prNumber} was merged by this run (merged_at=${pr.merged_at}). ✓`);
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: prNumber, per_page: 100,
            });
            const newDecisive = reviews.filter(r =>
              (r.state === 'APPROVED' || r.state === 'CHANGES_REQUESTED') && !priorDecisive.has(r.id)
            );
            if (newDecisive.length > 0) {
              const latest = newDecisive[newDecisive.length - 1];
              core.info(`PR #${prNumber} not merged, but this run submitted a new decisive review (state=${latest.state}, by=${latest.user?.login}). ✓`);
              return;
            }

            core.setFailed(
              `Merge job left no durable outcome for PR #${prNumber}: this run neither merged it nor added a ` +
              `new APPROVED/CHANGES_REQUESTED review (only pending or comment-level activity was found). The ` +
              `model likely reported success without invoking the merge/review tools. Re-run with ` +
              `GEMINI_DEBUG=true and UPLOAD_ARTIFACTS=true and inspect .gemini/telemetry.log to see which ` +
              `tool calls actually fired.`
            );
