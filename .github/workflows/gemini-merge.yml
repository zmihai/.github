name: '🧪🚀 Gemini Test & Merge'

on:
  workflow_call:
    inputs:
      pull_request_number:
        type: string
        description: 'The pull request number'
        required: true

      is_fork:
        type: string
        description: 'Whether the pull request is from a fork'
        required: false
        default: 'false'

      review_summary:
        description: 'The summary of the review step'
        required: false
        type: string
        default: ''

      additional_context:
        type: string
        description: 'Any additional context from the request'
        required: false
        default: ''

      projects:
        description: 'JSON list of projects'
        required: true
        type: string
        default: '[]'

      ref:
        description: 'The branch, tag or SHA to checkout'
        required: false
        type: string

concurrency:
  group: '${{ github.workflow }}-merge-${{ github.event_name }}' # Only one merge should run at a time, to avoid cases where the previous merge causes a conflict
  cancel-in-progress: ${{ github.actor != 'dependabot[bot]' }}

defaults:
  run:
    shell: 'bash'

jobs:
  merge:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    permissions:
      contents: 'write'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'write'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Checkout repository'
        uses: 'actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd' # ratchet:actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: 'Resolve PR head ref'
        id: 'resolve_head_ref'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd' # ratchet:actions/github-script@v8
        env:
          INPUT_PR_NUMBER: '${{ inputs.pull_request_number }}'
        with:
          result-encoding: string
          script: |
            let headRef;
            // Prefer the head ref from the pull_request event payload when available.
            if (context.payload.pull_request) {
              headRef = context.payload.pull_request.head.ref;
            } else {
              // Fallback for issue_comment / pull_request_review_comment / etc. events,
              // where context.payload.pull_request is absent. We look the PR up via API.
              const prNumber = parseInt(process.env.INPUT_PR_NUMBER, 10);
              if (!prNumber) {
                throw new Error('pull_request_number input is required to resolve head_ref outside of pull_request events');
              }
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              headRef = pr.head.ref;
            }
            // Safety: head_ref is later substituted into a shell command by the merge agent
            // (`git push origin HEAD:refs/heads/<head_ref>`). Branch names are external input and git
            // permits shell metacharacters (e.g. `$`, backtick, `;`, `&`) in them, so reject anything
            // outside a conservative safe set before it can reach a shell that holds write credentials.
            if (!/^[A-Za-z0-9._\/-]+$/.test(headRef)) {
              throw new Error(`Refusing to proceed: PR head ref '${headRef}' contains characters outside [A-Za-z0-9._/-] and may be unsafe to use in a shell command.`);
            }
            return headRef;

      - name: 'Prepare prompt context'
        shell: 'bash'
        run: |-
          mkdir -p .gemini
          jq -n \
            --arg repo "${REPOSITORY}" \
            --arg pr "${PULL_REQUEST_NUMBER}" \
            --arg issue_title "${ISSUE_TITLE}" \
            --arg issue_body "${ISSUE_BODY}" \
            --arg context "${ADDITIONAL_CONTEXT}" \
            --argjson projects "${PROJECTS:-[]}" \
            --arg review_summary "${REVIEW_SUMMARY}" \
            --arg head_ref "${HEAD_REF}" \
            '{repository: $repo, pull_request_number: $pr, issue_title: $issue_title, issue_body: $issue_body, additional_context: $context, projects: $projects, review_summary: $review_summary, head_ref: $head_ref}' > .gemini/context.json
        env:
          REPOSITORY: '${{ github.repository }}'
          PULL_REQUEST_NUMBER: '${{ inputs.pull_request_number }}'
          ISSUE_TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          ISSUE_BODY: '${{ github.event.pull_request.body || github.event.issue.body }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
          PROJECTS: '${{ inputs.projects }}'
          REVIEW_SUMMARY: '${{ inputs.review_summary }}'
          HEAD_REF: '${{ steps.resolve_head_ref.outputs.result }}'

      # Snapshot the PR's decisive-review IDs and merged state just before the model runs, so the gate
      # below can detect outcomes produced by THIS merge job by identity rather than by timestamp.
      # Comparing IDs (not times) is immune to whole-second timestamp granularity and to clock skew
      # between the runner and the GitHub API, and it correctly excludes pre-existing reviews/merges and
      # the review submitted earlier in the same dispatch by the review job (which completes first).
      - name: 'Snapshot PR review state'
        id: 'pre_state'
        if: ${{ inputs.is_fork != 'true' }}
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd' # ratchet:actions/github-script@v8
        env:
          INPUT_PR_NUMBER: '${{ inputs.pull_request_number }}'
        with:
          github-token: '${{ steps.mint_identity_token.outputs.token || secrets.CALLER_GITHUB_TOKEN || secrets.GITHUB_TOKEN || github.token }}'
          script: |
            const prNumber = parseInt(process.env.INPUT_PR_NUMBER, 10);
            if (!prNumber) {
              core.setFailed('pull_request_number input is required to snapshot PR state');
              return;
            }
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: prNumber, per_page: 100,
            });
            const decisiveIds = reviews
              .filter(r => r.state === 'APPROVED' || r.state === 'CHANGES_REQUESTED')
              .map(r => r.id);
            // Use merged_at (non-null when merged) as the merged indicator — reliably present on the
            // single-PR GET response.
            const isMerged = pr.merged_at != null;
            core.setOutput('was_merged', String(isMerged));
            core.setOutput('decisive_review_ids', JSON.stringify(decisiveIds));
            core.info(`Pre-run snapshot: merged=${isMerged}, decisive reviews=${decisiveIds.length}`);

      - name: 'Run Gemini pull request merge'
        if: ${{ inputs.is_fork != 'true' }}
        uses: 'google-github-actions/run-gemini-cli@3ca2577f2714990269a7378904cf70ae1e01e288' # ratchet:google-github-actions/run-gemini-cli@main
        id: 'gemini_pr_merge'
        env:
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.CALLER_GITHUB_TOKEN || secrets.GITHUB_TOKEN || github.token }}'
          GEMINI_CLI_TRUST_WORKSPACE: '${{ inputs.is_fork != ''true'' && (github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository) }}'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          # Compatible with current Gemini CLI: the tools.core allowlist below explicitly
          # includes the MCP tool FQNs (mcp_github_*), which is required for the GitHub MCP
          # tools to be exposed to the model (verified on 0.42.0 through 0.46.0 — tools.core
          # acts as a global allowlist that also filters MCP tools, not just built-ins).
          gemini_cli_version: "${{ vars.GEMINI_CLI_VERSION || '0.46.0' }}"
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: "${{ vars.GEMINI_MERGE_MODEL || vars.GEMINI_MODEL || 'gemini-flash-latest' }}"
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-merge'
          # Explicitly set the PR number to handle `issue_comment` triggers (which GitHub treats as issues, not PRs)
          github_pr_number: '${{ inputs.pull_request_number }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 100
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "pull_request_review_write",
                    "add_comment_to_pending_review",
                    "merge_pull_request",
                    "pull_request_read"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "run_shell_command",
                  "grep_search",
                  "list_directory",
                  "read_file",
                  "mcp_github_pull_request_review_write",
                  "mcp_github_add_comment_to_pending_review",
                  "mcp_github_merge_pull_request",
                  "mcp_github_pull_request_read"
                ]
              }
            }
          extensions: |
            [
              "https://github.com/gemini-cli-extensions/code-review"
            ]
          prompt: '/gemini-merge --merge_strategy=squash --repository=${{ github.repository }} --pr=${{ inputs.pull_request_number }} --title=${{ github.event.pull_request.title || github.event.issue.title }} --projects="${{ inputs.projects }}" --review_summary="${{ inputs.review_summary }}"'

      # The Gemini CLI step reports "success" whenever the process exits 0, which happens even when the
      # model only narrates actions (e.g. "I merged the PR") without invoking the corresponding tools.
      # This gate asserts that THIS merge job left a DURABLE outcome on the PR: either the PR became
      # merged (and was not already merged before the run), or a NEW decisive review (APPROVED /
      # CHANGES_REQUESTED) appeared that was not present in the pre-run snapshot. Comparing against the
      # snapshot by review id excludes pre-existing reviews/merges and the review submitted earlier in
      # the same dispatch by the review job. A run that ends with only pending/comment activity is
      # treated as a failure so it surfaces red and triggers the dispatch fallthrough notification.
      - name: 'Verify durable merge outcome'
        if: ${{ success() && inputs.is_fork != 'true' }}
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd' # ratchet:actions/github-script@v8
        env:
          INPUT_PR_NUMBER: '${{ inputs.pull_request_number }}'
          PRE_WAS_MERGED: '${{ steps.pre_state.outputs.was_merged }}'
          PRE_DECISIVE_REVIEW_IDS: '${{ steps.pre_state.outputs.decisive_review_ids }}'
        with:
          github-token: '${{ steps.mint_identity_token.outputs.token || secrets.CALLER_GITHUB_TOKEN || secrets.GITHUB_TOKEN || github.token }}'
          script: |
            const prNumber = parseInt(process.env.INPUT_PR_NUMBER, 10);
            if (!prNumber) {
              core.setFailed('pull_request_number input is required to verify the merge outcome');
              return;
            }
            const { owner, repo } = context.repo;

            // Outcomes present BEFORE the model ran do not count as produced by THIS run. Fail CLOSED if
            // the pre-run snapshot is missing or malformed: without a trustworthy snapshot we cannot tell
            // a new decisive review from a pre-existing one, and silently assuming "none" would let a
            // pre-existing review mask a no-op run (a false green) — the opposite of this gate's purpose.
            const wasMerged = process.env.PRE_WAS_MERGED === 'true';
            const rawPriorIds = process.env.PRE_DECISIVE_REVIEW_IDS;
            let priorIds;
            try {
              priorIds = JSON.parse(rawPriorIds);
            } catch (e) {
              core.setFailed(`Could not parse the pre-run review snapshot (PRE_DECISIVE_REVIEW_IDS=${JSON.stringify(rawPriorIds)}): ${e.message}. Failing closed so a missing snapshot cannot mask a no-op run.`);
              return;
            }
            if (!Array.isArray(priorIds)) {
              core.setFailed(`Pre-run review snapshot was not an array (got ${typeof priorIds}). Failing closed.`);
              return;
            }
            const priorDecisive = new Set(priorIds);

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const isMerged = pr.merged_at != null;
            if (isMerged && !wasMerged) {
              core.info(`PR #${prNumber} was merged by this run (merged_at=${pr.merged_at}). ✓`);
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: prNumber, per_page: 100,
            });
            const newDecisive = reviews.filter(r =>
              (r.state === 'APPROVED' || r.state === 'CHANGES_REQUESTED') && !priorDecisive.has(r.id)
            );
            if (newDecisive.length > 0) {
              const latest = newDecisive[newDecisive.length - 1];
              core.info(`PR #${prNumber} not merged, but this run submitted a new decisive review (state=${latest.state}, by=${latest.user?.login}). ✓`);
              return;
            }

            core.setFailed(
              `Merge job left no durable outcome for PR #${prNumber}: this run neither merged it nor added a ` +
              `new APPROVED/CHANGES_REQUESTED review (only pending or comment-level activity was found). The ` +
              `model likely reported success without invoking the merge/review tools. Re-run with ` +
              `GEMINI_DEBUG=true and UPLOAD_ARTIFACTS=true and inspect .gemini/telemetry.log to see which ` +
              `tool calls actually fired.`
            );
