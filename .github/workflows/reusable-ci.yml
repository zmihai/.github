name: Reusable CI Workflow

on:
  workflow_call:
    inputs:
      language:
        description: 'Language to use (javascript, python, php)'
        required: true
        type: string

      language-version:
        description: 'Language version to use (20, 3.11, 8.3, etc)'
        required: true
        type: string

      working-directory:
        description: 'Working directory for commands'
        required: false
        type: string
        default: '.'

      run-lint:
        description: 'Run linting'
        required: false
        type: boolean
        default: true

      run-test:
        description: 'Run tests'
        required: false
        type: boolean
        default: true

      run-build:
        description: 'Run build'
        required: false
        type: boolean
        default: true

      build-before-test:
        description: 'Run build before tests'
        required: false
        type: boolean
        default: false

      ref:
        description: 'The branch, tag or SHA to checkout'
        required: false
        type: string

    outputs:
      outcome:
        description: 'The CI outcome'
        value: ${{ (jobs.ci-npm.result != 'skipped' && jobs.ci-npm.result) || (jobs.ci-python.result != 'skipped' && jobs.ci-python.result) || (jobs.ci-php.result != 'skipped' && jobs.ci-php.result) || 'failure' }}

defaults:
  run:
    shell: bash

jobs:
  resolve-ref:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      issues: 'read'
      pull-requests: 'read'
    outputs:
      ref: ${{ steps.resolve.outputs.result }}
    steps:
      - id: resolve
        uses: actions/github-script@v7
        env:
          INPUT_REF: ${{ inputs.ref }}
        with:
          script: |
            const inputRef = process.env.INPUT_REF;
            if (inputRef) return inputRef;
            if (context.payload.pull_request) return context.payload.pull_request.head.sha;
            if (['issue_comment', 'pull_request_review_comment', 'pull_request_review'].includes(context.eventName)) {
              const issueNumber = context.payload.issue?.number || context.payload.pull_request?.number;
              if (issueNumber) {
                try {
                  const { data: pr } = await github.rest.pulls.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: issueNumber,
                  });
                  console.log(`Resolved PR head SHA: ${pr.head.sha}`);
                  return pr.head.sha;
                } catch (e) {
                  console.log(`Could not resolve PR head SHA for issue ${issueNumber}. Falling back to default ref.`);
                }
              }
            }
            return context.sha;
          result-encoding: string

  ci-npm:
    needs: resolve-ref
    if: ${{ inputs.language == 'javascript' }}
    uses: './.github/workflows/ci-npm.yml'
    with:
      node-version: ${{ inputs.language-version }}
      working-directory: ${{ inputs.working-directory }}
      run-lint: ${{ inputs.run-lint }}
      run-test: ${{ inputs.run-test }}
      run-build: ${{ inputs.run-build }}
      build-before-test: ${{ inputs.build-before-test }}
      ref: ${{ needs.resolve-ref.outputs.ref }}
    secrets: inherit

  ci-python:
    needs: resolve-ref
    if: ${{ inputs.language == 'python' }}
    uses: './.github/workflows/ci-python.yml'
    with:
      python-version: ${{ inputs.language-version }}
      working-directory: ${{ inputs.working-directory }}
      run-lint: ${{ inputs.run-lint }}
      ref: ${{ needs.resolve-ref.outputs.ref }}
    secrets: inherit

  ci-php:
    needs: resolve-ref
    if: ${{ inputs.language == 'php' }}
    uses: './.github/workflows/ci-php.yml'
    with:
      php-version: ${{ inputs.language-version }}
      working-directory: ${{ inputs.working-directory }}
      run-lint: ${{ inputs.run-lint }}
      run-test: ${{ inputs.run-test }}
      ref: ${{ needs.resolve-ref.outputs.ref }}
    secrets: inherit

  ci-unsupported:
    if: ${{ inputs.language != 'javascript' && inputs.language != 'python' && inputs.language != 'php' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail for unsupported CI language
        run: |
          echo "CI workflow is not supported for language '${{ inputs.language }}'. Supported languages: javascript, python, php."
          exit 1
