name: '🔎 Gemini Review'

on:
  workflow_call:
    inputs:
      additional_context:
        type: string
        description: 'Any additional context from the request'
        required: false

      command:
        type: string
        description: 'The command used to call this workflow'
        required: true

      issue_number:
        type: string
        description: 'The issue/pull request number'
        required: true

      is_fork:
        type: string
        description: 'Whether the pull request is from a fork'
        required: false
        default: 'false'

      projects:
        description: 'JSON list of projects'
        required: false
        type: string
        default: '[]'

      ref:
        description: 'The branch, tag or SHA to checkout'
        required: false
        type: string

    secrets:
      GEMINI_API_KEY:
        description: 'Gemini API key (optional when authenticating to Gemini via GOOGLE_API_KEY or Vertex AI)'
        required: false
      GOOGLE_API_KEY:
        description: 'Optional alternative Gemini auth'
        required: false
      APP_PRIVATE_KEY:
        description: 'Private key for the GitHub App identity (vars.APP_ID)'
        required: false

    outputs:
      command:
        description: 'The command used to call this workflow'
        value: ${{ jobs.review.outputs.command }}

      issue_number:
        description: 'The issue/pull request number'
        value: ${{ jobs.review.outputs.issue_number }}

      review_summary:
        description: 'The summary of the review step'
        value: ${{ jobs.review.outputs.review_summary }}

concurrency:
  group: '${{ github.workflow }}-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  review:
    runs-on: 'ubuntu-latest'
    # Two sequential Gemini passes now run in this job (code review + security analysis), so allow more
    # wall-clock than the single-pass default.
    timeout-minutes: 25
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    outputs:
      command: '${{ inputs.command }}'
      issue_number: '${{ inputs.issue_number }}'
      review_summary: '${{ steps.combine_summary.outputs.summary }}'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Checkout repository'
        uses: 'actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd' # ratchet:actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

      # The context file deliberately lives at the repository root, NOT under .gemini/ — the Gemini
      # CLI's @{file} include SILENTLY drops gitignored paths, and some consumer repos gitignore
      # `.gemini/`. See the 'Prepare prompt context' step in gemini-merge.yml for the canonical
      # rationale; keep the two steps' guard and path in sync.
      - name: 'Prepare prompt context'
        shell: 'bash'
        run: |-
          if git check-ignore -q "${CONTEXT_FILE}"; then
            echo "::error::'${CONTEXT_FILE}' is ignored by a .gitignore rule in this repository. The Gemini CLI silently drops gitignored @{} includes, so the review agent would run without its Input Data. Remove the ignore rule or relocate the context file."
            exit 1
          fi
          mkdir -p .gemini
          jq -n \
            --arg repo "${REPOSITORY}" \
            --arg pr "${PULL_REQUEST_NUMBER}" \
            --arg issue_title "${ISSUE_TITLE}" \
            --arg issue_body "${ISSUE_BODY}" \
            --arg context "${ADDITIONAL_CONTEXT}" \
            --argjson projects "${PROJECTS:-[]}" \
            '{repository: $repo, pull_request_number: $pr, issue_title: $issue_title, issue_body: $issue_body, additional_context: $context, projects: $projects}' > "${CONTEXT_FILE}"
        env:
          CONTEXT_FILE: '.gemini-context.json'
          REPOSITORY: '${{ github.repository }}'
          PULL_REQUEST_NUMBER: '${{ inputs.issue_number }}'
          ISSUE_TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          ISSUE_BODY: '${{ github.event.pull_request.body || github.event.issue.body }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
          PROJECTS: '${{ inputs.projects }}'

      # See the 'Install repo Gemini commands' step in gemini-merge.yml for the canonical rationale
      # (unresolved /commands silently degrade to literal prompt text; the action's own command
      # copy runs later and overwrites same-named files — hence the distinctive names).
      - name: 'Install repo Gemini commands'
        if: ${{ inputs.is_fork != 'true' }}
        uses: 'zmihai/.github/actions/install-gemini-commands@v0.12.4'

      # Canonical rationale for the pre-install steps (the other pre-install steps here and in
      # gemini-merge.yml reference this comment): run-gemini-cli's bundled installer pipes a
      # single "Y" into `gemini extensions install`, but extensions that declare Agent Skills
      # (code-review does) raise a SECOND consent prompt, and piped input beyond the first prompt
      # is dropped — the read hits EOF and the install aborts with exit 1, failing the run. So
      # install here with the CLI's `--consent` flag, which skips the consent prompts entirely;
      # stdin is </dev/null so a future extra prompt can never consume CI input (it hits EOF and
      # aborts or stalls, and the job-level timeout-minutes bounds the worst case). The
      # run-gemini-cli step below picks the extension up from $HOME/.gemini — its `extensions:`
      # input is intentionally NOT set (re-installing there would re-prompt and fail again).
      - name: 'Pre-install code-review extension (non-interactive)'
        if: ${{ inputs.is_fork != 'true' }}
        env:
          # Keep in sync with the `gemini_cli_version` passed to run-gemini-cli below. Unlike the
          # action (which builds non-semver refs from source), npx resolves npm versions and
          # dist-tags only (e.g. 0.46.0, latest, preview, nightly) — never set a git ref here.
          GEMINI_CLI_VERSION: "${{ vars.GEMINI_CLI_VERSION || '0.46.0' }}"
        run: |-
          npx --yes "@google/gemini-cli@${GEMINI_CLI_VERSION}" extensions install --consent 'https://github.com/gemini-cli-extensions/code-review' </dev/null

      - name: 'Run Gemini pull request review'
        if: ${{ inputs.is_fork != 'true' }}
        uses: 'google-github-actions/run-gemini-cli@3ca2577f2714990269a7378904cf70ae1e01e288' # ratchet:google-github-actions/run-gemini-cli@main
        id: 'gemini_pr_review'
        env:
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          GEMINI_CLI_TRUST_WORKSPACE: '${{ inputs.is_fork != ''true'' && (github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository) }}'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          # Compatible with current Gemini CLI: the tools.core allowlist below explicitly
          # includes the MCP tool FQNs (mcp_github_*), which is required for the GitHub MCP
          # tools to be exposed to the model (verified on 0.42.0 through 0.46.0 — tools.core
          # acts as a global allowlist that also filters MCP tools, not just built-ins).
          # activate_skill is allowlisted because extension Agent Skills (the code-review
          # extension declares one) activate via that built-in tool; leaving it unlisted makes
          # the model burn turns on denied calls (run-gemini-cli issue #532).
          gemini_cli_version: "${{ vars.GEMINI_CLI_VERSION || '0.46.0' }}"
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: "${{ vars.GEMINI_REVIEW_MODEL || vars.GEMINI_MODEL || 'gemini-flash-latest' }}"
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-review'
          # Explicitly set the PR number to handle `issue_comment` triggers (which GitHub treats as issues, not PRs)
          github_pr_number: '${{ inputs.issue_number }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 100
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "pull_request_review_write",
                    "add_comment_to_pending_review",
                    "pull_request_read"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "run_shell_command",
                  "grep_search",
                  "list_directory",
                  "read_file",
                  "activate_skill",
                  "mcp_github_pull_request_review_write",
                  "mcp_github_add_comment_to_pending_review",
                  "mcp_github_pull_request_read"
                ]
              }
            }
          prompt: '/pr-review --repository=${{ github.repository }} --pr=${{ inputs.issue_number }} --title=${{ github.event.pull_request.title || github.event.issue.title }} --projects="${{ inputs.projects }}"'

      # Extra, security-focused pass using the gemini-cli security extension. Run as a SEPARATE
      # gemini invocation because each pass needs its own per-invocation settings: github MCP
      # server version (v0.18.0 here, matching what the security extension was authored against),
      # includeTools, and tools.core allowlist. Findings are posted to the PR and folded into
      # review_summary below.

      # Installed with `--consent` — see the 'Pre-install code-review extension' step above for
      # the canonical rationale. The CLI loads EVERY extension under $HOME/.gemini, so the
      # code-review extension installed for the step above is removed first: this invocation runs
      # with only the security extension, keeping its context and skills untouched by
      # code-review's.
      - name: 'Pre-install security extension (non-interactive)'
        if: ${{ inputs.is_fork != 'true' }}
        env:
          # Keep in sync with the `gemini_cli_version` passed to run-gemini-cli below (npm
          # versions/dist-tags only — see the code-review pre-install step).
          GEMINI_CLI_VERSION: "${{ vars.GEMINI_CLI_VERSION || '0.46.0' }}"
        run: |-
          if [ -d "${HOME}/.gemini/extensions/code-review" ]; then
            npx --yes "@google/gemini-cli@${GEMINI_CLI_VERSION}" extensions uninstall code-review </dev/null
          fi
          npx --yes "@google/gemini-cli@${GEMINI_CLI_VERSION}" extensions install --consent 'https://github.com/gemini-cli-extensions/security.git' </dev/null

      - name: 'Run Gemini security analysis'
        if: ${{ inputs.is_fork != 'true' }}
        uses: 'google-github-actions/run-gemini-cli@3ca2577f2714990269a7378904cf70ae1e01e288' # ratchet:google-github-actions/run-gemini-cli@main
        id: 'gemini_security'
        env:
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          GEMINI_CLI_TRUST_WORKSPACE: '${{ inputs.is_fork != ''true'' && (github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository) }}'
          REPOSITORY: '${{ github.repository }}'
          PULL_REQUEST_NUMBER: '${{ inputs.issue_number }}'
          ISSUE_TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          ISSUE_BODY: '${{ github.event.pull_request.body || github.event.issue.body }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          # See the review step above: tools.core must list the mcp_github_* FQNs for the
          # MCP tools to reach the model, on all CLI versions including latest, and
          # activate_skill in case the security extension ever declares Agent Skills.
          gemini_cli_version: "${{ vars.GEMINI_CLI_VERSION || '0.46.0' }}"
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: "${{ vars.GEMINI_SECURITY_REVIEW_MODEL || vars.GEMINI_MODEL || 'gemini-flash-latest' }}"
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          # Disabled to avoid colliding with the review step's "gemini-output" artifact in this same job.
          upload_artifacts: 'false'
          workflow_name: 'gemini-security'
          github_pr_number: '${{ inputs.issue_number }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 100
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry-security.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.18.0"
                  ],
                  "includeTools": [
                    "add_comment_to_pending_review",
                    "create_pending_pull_request_review",
                    "pull_request_read",
                    "submit_pending_pull_request_review"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "run_shell_command",
                  "grep_search",
                  "list_directory",
                  "read_file",
                  "activate_skill",
                  "mcp_github_add_comment_to_pending_review",
                  "mcp_github_create_pending_pull_request_review",
                  "mcp_github_pull_request_read",
                  "mcp_github_submit_pending_pull_request_review"
                ]
              }
            }
          prompt: '/security:analyze-github-pr'

      # Fold the code-review summary and the security-analysis summary into one review_summary, so the merge
      # job's existing "Critical/High in the Review Summary blocks the merge" gate applies to security
      # findings too. Runs even if a prior gemini step errored, capturing whatever summaries exist.
      # Order matters: the security summary of a dependency-only PR routinely ends with an emphatic
      # all-clear ("no findings were identified"), and with it last that all-clear sat in the
      # highest-recency position of the merge prompt, outweighing blocking findings above it in an
      # observed run. Code review goes last so the section likelier to carry blocking findings is
      # what the merge model reads most recently.
      - name: 'Combine review and security summaries'
        id: 'combine_summary'
        if: ${{ !cancelled() && inputs.is_fork != 'true' }}
        shell: 'bash'
        env:
          REVIEW_SUMMARY: '${{ steps.gemini_pr_review.outputs.summary }}'
          SECURITY_SUMMARY: '${{ steps.gemini_security.outputs.summary }}'
        run: |-
          {
            echo "summary<<GEMINI_SUMMARY_EOF"
            echo "## Security Analysis"
            echo "${SECURITY_SUMMARY:-(no security analysis summary produced)}"
            echo ""
            echo "## Code Review"
            echo "${REVIEW_SUMMARY:-(no code review summary produced)}"
            echo "GEMINI_SUMMARY_EOF"
          } >> "${GITHUB_OUTPUT}"
