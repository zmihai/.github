name: 'Self CI'

# CI for this repository's own workflow files and templates. Plain YAML
# parsing and the template tests cannot catch expression-context violations
# (e.g. `secrets` referenced in a step-level `if:` fails GitHub's validation
# at run time while parsing fine as YAML); actionlint does.

on:
  pull_request:
  push:
    branches:
      - 'master'

permissions:
  contents: 'read'

defaults:
  run:
    shell: 'bash'

jobs:
  actionlint:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      - uses: 'actions/checkout@v6.0.2'

      - name: 'Install actionlint'
        env:
          VERSION: '1.7.12'
          SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint

      - name: 'Run actionlint'
        # Each -ignore suppresses a known actionlint false positive:
        # - `jobs.<job_id>.result` in `on.workflow_call.outputs` is documented
        #   GitHub behavior (and load-bearing for the CI outcome plumbing), but
        #   actionlint models the jobs context with outputs only.
        # - `$/path` self repository references take no `@ref` by design;
        #   actionlint 1.7.12 does not know the syntax and reports the ref as
        #   missing. tests/test_self_repository_refs.py checks their shape
        #   and targets instead.
        run: |
          ./actionlint -color \
            -ignore 'property "result" is not defined in object type' \
            -ignore 'specifying action "\$/[^"]+" in invalid format because ref is missing' \
            .github/workflows/*.yml workflow-templates/*.yml

  template-tests:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      - uses: 'actions/checkout@v6.0.2'

      - name: 'Run template tests'
        run: |
          python3 -m pip install --quiet pytest==9.1.1 pyyaml==6.0.3
          python3 -m pytest -q tests/

  # .github/workflows/actions.lock records the commit of every action the
  # workflows and composite actions use, transitive ones included; the runner
  # resolves actions from it, also when a consumer calls these workflows.
  # --verify fails when a `uses:` resolves to a commit the lockfile does not
  # record or a locked commit no longer verifies upstream. It does NOT fail
  # when a ref is merely respelled for the same commit (a SHA where the
  # lockfile has the tag), although the runner then ignores the lockfile for
  # that workflow; tests/test_actions_lockfile.py covers that case.
  lockfile:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      - uses: 'actions/checkout@v6.0.2'
        with:
          persist-credentials: false

      - name: 'Verify the actions lockfile'
        env:
          GH_TOKEN: '${{ github.token }}'
          VERSION: 'v0.4.1'
        run: |
          gh extension install github/gh-actions-lock --pin "${VERSION}"
          gh actions-lock --verify
