name: Reusable Security Scan

on:
  workflow_call:
    inputs:
      scan-dependencies:
        description: 'Scan dependencies for vulnerabilities'
        required: false
        type: boolean
        default: true

      scan-code:
        description: 'Run CodeQL analysis'
        required: false
        type: boolean
        default: false

      language:
        description: 'Language for CodeQL (javascript, python, php, etc.)'
        required: false
        type: string
        default: 'javascript'

      language-version:
        description: 'Language version to use (20, 3.11, 8.4, etc)'
        required: false
        type: string

      working-directory:
        description: 'Working directory for commands'
        required: false
        type: string
        default: '.'

      ref:
        description: 'The branch, tag or SHA to checkout'
        required: false
        type: string

    outputs:
      outcome:
        description: 'The overall security scan outcome'
        value: ${{ (jobs.dependency-scan-unsupported.result != 'skipped') && 'failure' || ((jobs.dependency-scan-javascript.result == 'success' || jobs.dependency-scan-javascript.result == 'skipped') && (jobs.dependency-scan-python.result == 'success' || jobs.dependency-scan-python.result == 'skipped') && (jobs.dependency-scan-php.result == 'success' || jobs.dependency-scan-php.result == 'skipped') && (jobs.codeql-scan.result == 'success' || jobs.codeql-scan.result == 'skipped') && 'success' || 'failure') }}

defaults:
  run:
    shell: bash

jobs:
  resolve-ref:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      issues: 'read'
      pull-requests: 'read'
    outputs:
      ref: ${{ steps.resolve.outputs.result }}
    steps:
      - id: resolve
        uses: actions/github-script@v7
        env:
          INPUT_REF: ${{ inputs.ref }}
        with:
          script: |
            const inputRef = process.env.INPUT_REF;
            if (inputRef) return inputRef;
            if (context.payload.pull_request) return context.payload.pull_request.head.sha;
            if (['issue_comment', 'pull_request_review_comment', 'pull_request_review'].includes(context.eventName)) {
              const issueNumber = context.payload.issue?.number || context.payload.pull_request?.number;
              if (issueNumber) {
                try {
                  const { data: pr } = await github.rest.pulls.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: issueNumber,
                  });
                  console.log(`Resolved PR head SHA: ${pr.head.sha}`);
                  return pr.head.sha;
                } catch (e) {
                  throw new Error(`Could not resolve PR head SHA for issue ${issueNumber}: ${e.message}`);
                }
              }
            }
            return context.sha;
          result-encoding: string

  dependency-scan-javascript:
    needs: resolve-ref
    if: ${{ inputs.scan-dependencies && inputs.language == 'javascript' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}

      - name: Setup Node Environment
        uses: zmihai/.github/actions/setup-node-env@v0.4.0
        with:
          node-version: ${{ inputs.language-version || 'lts/*' }}
          working-directory: ${{ inputs.working-directory }}
          install-dependencies: 'false'

      - name: Run npm audit
        run: npm audit --audit-level=moderate

  dependency-scan-python:
    needs: resolve-ref
    if: ${{ inputs.scan-dependencies && inputs.language == 'python' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}

      - name: Setup Python Environment
        uses: zmihai/.github/actions/setup-python-env@v0.4.0
        with:
          python-version: ${{ inputs.language-version || '3.11' }}
          working-directory: ${{ inputs.working-directory }}
          install-dependencies: 'false'

      - name: Run pip audit
        run: pip install pip-audit && pip-audit

  dependency-scan-php:
    needs: resolve-ref
    if: ${{ inputs.scan-dependencies && inputs.language == 'php' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}

      - name: Setup PHP Environment
        uses: ./actions/setup-php-env
        with:
          php-version: ${{ inputs.language-version || '8.4' }}
          working-directory: ${{ inputs.working-directory }}
          install-dependencies: 'false'

      - name: Run composer audit
        run: composer audit

  dependency-scan-unsupported:
    if: ${{ inputs.scan-dependencies && inputs.language != 'javascript' && inputs.language != 'python' && inputs.language != 'php' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail for unsupported dependency scan language
        run: |
          echo "Dependency scanning is not supported for language '${{ inputs.language }}'. Supported languages: javascript, python, php."
          exit 1

  codeql-scan:
    needs: resolve-ref
    if: ${{ inputs.scan-code }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ inputs.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
