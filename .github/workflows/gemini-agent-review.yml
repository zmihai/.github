name: '🧪 Gemini Agent Review (experiment)'

# EXPERIMENT, not part of the released pipeline. Same interface as gemini-review.yml, but the
# review runs on the Gemini API's managed agent (see actions/gemini-agent) instead of gemini-cli.
#
# How it differs from gemini-review.yml:
# - One pass: the code review and the security analysis are one review with one summary.
# - The same command prompt (.github/commands/pr-review.toml), with a short section appended
#   that describes this environment.
# - The agent works in a sandbox hosted by Google, on its own clone; the runner checks out nothing.

on:
  workflow_call:
    inputs:
      additional_context:
        type: string
        description: 'Any additional context from the request'
        required: false

      command:
        type: string
        description: 'The command used to call this workflow'
        required: true

      issue_number:
        type: string
        description: 'The issue/pull request number'
        required: true

      is_fork:
        type: string
        description: 'Whether the pull request is from a fork'
        required: false
        default: 'false'

      projects:
        description: 'JSON list of projects'
        required: false
        type: string
        default: '[]'

      ref:
        description: 'Unused; kept so the dispatcher can call either review workflow'
        required: false
        type: string

    secrets:
      GEMINI_API_KEY:
        description: 'Gemini API key'
        required: true
      APP_PRIVATE_KEY:
        description: 'Private key for the GitHub App identity. The App path activates only when vars.APP_ID and this key are both set; with either missing, this workflow falls back to the default token.'
        required: false

    outputs:
      command:
        description: 'The command used to call this workflow'
        value: ${{ jobs.review.outputs.command }}
      issue_number:
        description: 'The issue/pull request number'
        value: ${{ jobs.review.outputs.issue_number }}
      review_summary:
        description: 'The summary of the review step'
        value: ${{ jobs.review.outputs.review_summary }}

concurrency:
  group: '${{ github.workflow }}-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  review:
    runs-on: 'ubuntu-latest'
    env:
      APP_KEY_AVAILABLE: ${{ secrets.APP_PRIVATE_KEY != '' }}
    timeout-minutes: 30
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    outputs:
      command: '${{ inputs.command }}'
      issue_number: '${{ inputs.issue_number }}'
      review_summary: '${{ steps.summary.outputs.summary }}'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID != '' && env.APP_KEY_AVAILABLE == 'true' }}
        uses: 'actions/create-github-app-token@v2.1.1'
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Prepare prompt context'
        if: ${{ inputs.is_fork != 'true' }}
        run: |-
          jq -n \
            --arg repo "${REPOSITORY}" \
            --arg pr "${PULL_REQUEST_NUMBER}" \
            --arg issue_title "${ISSUE_TITLE}" \
            --arg issue_body "${ISSUE_BODY}" \
            --arg context "${ADDITIONAL_CONTEXT}" \
            --argjson projects "${PROJECTS:-[]}" \
            '{repository: $repo, pull_request_number: $pr, issue_title: $issue_title, issue_body: $issue_body, additional_context: $context, projects: $projects}' > "${RUNNER_TEMP}/gemini-context.json"
        env:
          REPOSITORY: '${{ github.repository }}'
          PULL_REQUEST_NUMBER: '${{ inputs.issue_number }}'
          ISSUE_TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          ISSUE_BODY: '${{ github.event.pull_request.body || github.event.issue.body }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
          PROJECTS: '${{ inputs.projects }}'

      # The IDs of the reviews that exist before the agent runs, so the summary step can tell the
      # review this run submits from older ones by identity.
      - name: 'Snapshot existing reviews'
        if: ${{ inputs.is_fork != 'true' }}
        env:
          GH_TOKEN: '${{ steps.mint_identity_token.outputs.token || github.token }}'
          REPOSITORY: '${{ github.repository }}'
          PULL_REQUEST_NUMBER: '${{ inputs.issue_number }}'
        run: |-
          gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/reviews?per_page=100" --paginate \
            --jq '.[].id' > "${RUNNER_TEMP}/reviews-before.txt"
          echo "Reviews before the run: $(wc -l < "${RUNNER_TEMP}/reviews-before.txt")"

      - name: 'Run the review agent'
        id: 'agent'
        if: ${{ inputs.is_fork != 'true' }}
        uses: '$/actions/gemini-agent'
        with:
          mode: 'review'
          model: "${{ vars.GEMINI_AGENT_REVIEW_MODEL || 'gemini-3.5-flash-lite' }}"
          pull_request_number: '${{ inputs.issue_number }}'
          context_file: '${{ runner.temp }}/gemini-context.json'
          prompt_args: '--repository=${{ github.repository }} --pr=${{ inputs.issue_number }}'
          github_token: '${{ steps.mint_identity_token.outputs.token || github.token }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'

      # The summary handed to the merge job is the body of the review this run submitted, read back
      # from GitHub. When the agent submitted none, its final reply stands in and the job fails:
      # the command prompt requires a submitted review.
      - name: 'Collect the review summary'
        id: 'summary'
        if: ${{ !cancelled() && inputs.is_fork != 'true' }}
        env:
          GH_TOKEN: '${{ steps.mint_identity_token.outputs.token || github.token }}'
          REPOSITORY: '${{ github.repository }}'
          PULL_REQUEST_NUMBER: '${{ inputs.issue_number }}'
          REPLY_FILE: '${{ steps.agent.outputs.reply_file }}'
        run: |-
          touch "${RUNNER_TEMP}/reviews-before.txt"
          gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/reviews?per_page=100" --paginate \
            --jq '.[] | select(.state != "PENDING") | [.id, .state, .user.login] | @tsv' > "${RUNNER_TEMP}/reviews-after.tsv"
          new_id=''
          new_state=''
          while IFS=$'\t' read -r id state login; do
            if ! grep -qx "${id}" "${RUNNER_TEMP}/reviews-before.txt"; then
              new_id="${id}"
              new_state="${state}"
              echo "New review ${id}: ${state} by ${login}"
            fi
          done < "${RUNNER_TEMP}/reviews-after.tsv"

          if [[ -n "${new_id}" ]]; then
            gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/reviews/${new_id}" --jq '.body' > "${RUNNER_TEMP}/review-summary.md"
          elif [[ -n "${REPLY_FILE}" && -s "${REPLY_FILE}" ]]; then
            cp "${REPLY_FILE}" "${RUNNER_TEMP}/review-summary.md"
          else
            echo '(no review summary produced)' > "${RUNNER_TEMP}/review-summary.md"
          fi

          echo '--- REVIEW_SUMMARY ---'
          cat "${RUNNER_TEMP}/review-summary.md"
          echo '--- END REVIEW_SUMMARY ---'
          {
            echo 'summary<<GEMINI_SUMMARY_EOF'
            echo "## Review (state: ${new_state:-NOT SUBMITTED})"
            head -c 20000 "${RUNNER_TEMP}/review-summary.md"
            echo
            echo 'GEMINI_SUMMARY_EOF'
          } >> "${GITHUB_OUTPUT}"

          if [[ -z "${new_id}" ]]; then
            echo '::error::The agent finished without submitting a review.'
            exit 1
          fi
