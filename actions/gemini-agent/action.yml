name: 'Run the Gemini managed agent'
description: 'Opt-in preview engine (vars.GEMINI_ENGINE == agent). Runs the pr-review or pr-merge command prompt on the Gemini API managed agent (driven by the gemini-api CLI) instead of gemini-cli, and waits for it to finish.'

# The agent runs in a sandbox hosted by Google. It reaches GitHub in two ways only:
# - GitHub's hosted MCP server, which limits it to the pull request tools named in
#   build_request.py (review: read, review, comment; merge: the same plus merge).
# - git over github.com on its own clone, with the job token (git_token) attached by Google's
#   egress proxy. The token is never placed in the sandbox. In review mode the token can only read and github.com
#   is the whole network allowlist. In merge mode the token can write, so the agent can push a
#   fix to the pull request's branch (and, like gemini-cli on the runner, to any unprotected
#   branch), and the rest of the network is open so it can install dependencies and run checks.
# In both cases the token travels to Google inside the request.
#
# Not a defence against a pull request whose content talks the model into a misleading review or
# into misusing those tools.

inputs:
  mode:
    description: 'review or merge'
    required: true
  model:
    description: 'Model the agent runs on (an agent_config.model value)'
    required: true
  max_total_tokens:
    description: 'Token budget for the whole run (input + output + thinking)'
    required: false
    default: '3000000'
  pull_request_number:
    description: 'The pull request number'
    required: true
  expected_head_sha:
    description: 'The head commit the caller resolved earlier (a SHA, or a branch or tag that is resolved to one). When the pull request head is a different commit, the action fails instead of working on a commit the caller did not resolve.'
    required: false
    default: ''
  timeout_seconds:
    description: 'How long to poll for the agent to finish. After that the action makes one last status request (at most 30 seconds) and then cancels the run. Keep the job timeout at least two minutes above this value, so the action can still cancel the run.'
    required: false
    default: '1500'
  context_file:
    description: 'Path of the Input Data JSON file'
    required: true
  prompt_args:
    description: 'Arguments appended to the command prompt'
    required: false
    default: ''
  merge_path:
    description: "Merge runs only. 'direct': when the review job approved the head (or, on a merge-only command, the reviewer_login account's standing approval of the head is on the pull request) and no project outcome failed, the agent is told to merge without repeating the review. 'full': the agent always repeats the review before merging. Empty: the same as 'full' for now, with a notice that a later release changes the default to 'direct'."
    required: false
    default: ''
  reviewer_login:
    description: "Merge runs on the 'direct' merge path only. The account the review job submits reviews as. When the caller hands over no review summary (a merge-only command), that account's standing approval of the head commit is read from the pull request and takes its place. Empty: no such lookup."
    required: false
    default: ''
  github_token:
    description: 'Token the agent uses on GitHub'
    required: true
  git_token:
    description: 'Token for git over github.com in the sandbox (clone, fetch, push). Defaults to the job token on purpose, also when github_token is an App token: a push made with the job token starts no new workflow run, so a remediation push does not cancel the run that made it.'
    required: false
    default: '${{ github.token }}'
  gemini_api_key:
    description: 'Gemini API key'
    required: true

outputs:
  status:
    description: 'Final status of the agent run'
    value: '${{ steps.run.outputs.status }}'
  reply_file:
    description: 'Path of the file holding the agent''s final reply'
    value: '${{ steps.run.outputs.reply_file }}'
  head_sha:
    description: 'The pull request head commit the agent was pointed at'
    value: '${{ steps.pr.outputs.head }}'

runs:
  using: 'composite'
  steps:
    # The CLI is in beta and its maintainers ask CI users to pin a release. The archive is
    # checked against the digest GitHub publishes for the release asset.
    - name: 'Install the Gemini API CLI'
      shell: 'bash'
      env:
        VERSION: 'v0.4.6'
        SHA256: '78862dde519d9b47a9fb70b1f0340d19fa1245934d65e83f0e2dbc1d17cd2fa6'
      run: |-
        mkdir -p "${RUNNER_TEMP}/gemini-api"
        cd "${RUNNER_TEMP}/gemini-api"
        curl -sSfL --connect-timeout 15 --max-time 180 -o gemini-api.tar.gz \
          "https://github.com/google-gemini/gemini-api-cli/releases/download/${VERSION}/gemini-api_Linux_x86_64.tar.gz"
        echo "${SHA256}  gemini-api.tar.gz" | sha256sum -c -
        tar xzf gemini-api.tar.gz
        binary="$(find . -type f -name 'gemini-api' | head -n 1)"
        if [[ -z "${binary}" ]]; then
          echo '::error::The release archive holds no gemini-api binary.'
          exit 1
        fi
        chmod +x "${binary}"
        (cd "$(dirname "${binary}")" && pwd) >> "${GITHUB_PATH}"

    - name: 'Read the pull request'
      id: 'pr'
      shell: 'bash'
      env:
        GH_TOKEN: '${{ inputs.github_token }}'
        REPOSITORY: '${{ github.repository }}'
        PULL_REQUEST_NUMBER: '${{ inputs.pull_request_number }}'
        EXPECTED_HEAD_SHA: '${{ inputs.expected_head_sha }}'
      run: |-
        if [[ ! "${PULL_REQUEST_NUMBER}" =~ ^[0-9]+$ ]]; then
          echo "::error::pull_request_number must be a number, got '${PULL_REQUEST_NUMBER}'."
          exit 1
        fi
        gh pr view "${PULL_REQUEST_NUMBER}" -R "${REPOSITORY}" \
          --json baseRefName,headRefOid > "${RUNNER_TEMP}/agent-pr.json"
        base="$(jq -r '.baseRefName' "${RUNNER_TEMP}/agent-pr.json")"
        head="$(jq -r '.headRefOid' "${RUNNER_TEMP}/agent-pr.json")"
        if [[ ! "${head}" =~ ^[0-9a-f]{40}$ || ! "${base}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
          echo '::error::Could not read a usable head commit and base branch for the pull request.'
          exit 1
        fi
        # The caller may pass a branch, a tag or a short SHA; GitHub resolves it to a commit.
        expected="${EXPECTED_HEAD_SHA}"
        if [[ -n "${expected}" && ! "${expected}" =~ ^[0-9a-f]{40}$ ]]; then
          if [[ ! "${expected}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::expected_head_sha '${expected}' is not a usable ref."
            exit 1
          fi
          # A failed lookup yields no SHA, so the check below fails with its own message.
          expected="$(gh api "repos/${REPOSITORY}/commits/${expected}" --jq '.sha' || true)"
          if [[ ! "${expected}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve expected_head_sha '${EXPECTED_HEAD_SHA}' to a commit."
            exit 1
          fi
        fi
        if [[ -n "${expected}" && "${expected}" != "${head}" ]]; then
          echo "::error::The pull request head is ${head}, not the commit ${expected} this run resolved; not continuing on a commit this run did not resolve."
          exit 1
        fi
        {
          echo "base=${base}"
          echo "head=${head}"
        } >> "${GITHUB_OUTPUT}"

    # Fails early, with the HTTP status in the log, if GitHub's hosted MCP server refuses the token.
    - name: 'Check the GitHub MCP server accepts the token'
      shell: 'bash'
      env:
        GH_TOKEN: '${{ inputs.github_token }}'
        GITHUB_MCP_URL: 'https://api.githubcopilot.com/mcp/'
      run: |-
        # The header comes from stdin, so the token is not on curl's command line.
        http_status="$(curl -sS --connect-timeout 15 --max-time 60 -o "${RUNNER_TEMP}/mcp-init.txt" -w '%{http_code}' -X POST "${GITHUB_MCP_URL}" \
          -H @- \
          -H 'Content-Type: application/json' \
          -H 'Accept: application/json, text/event-stream' \
          -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"gemini-agent-preflight","version":"0"}}}' \
          <<< "Authorization: Bearer ${GH_TOKEN}")"
        echo "GitHub MCP initialize: HTTP ${http_status}"
        if [[ "${http_status}" != '200' ]]; then
          head -c 600 "${RUNNER_TEMP}/mcp-init.txt"
          echo
          echo '::error::The GitHub MCP server did not accept the token.'
          exit 1
        fi

    - name: 'Run the agent'
      id: 'run'
      shell: 'bash'
      env:
        GEMINI_API_KEY: '${{ inputs.gemini_api_key }}'
        MODE: '${{ inputs.mode }}'
        MODEL: '${{ inputs.model }}'
        MAX_TOTAL_TOKENS: '${{ inputs.max_total_tokens }}'
        PULL_REQUEST_NUMBER: '${{ inputs.pull_request_number }}'
        CONTEXT_FILE: '${{ inputs.context_file }}'
        PROMPT_ARGS: '${{ inputs.prompt_args }}'
        MERGE_PATH: '${{ inputs.merge_path }}'
        REVIEWER_LOGIN: '${{ inputs.reviewer_login }}'
        GH_TOKEN: '${{ inputs.github_token }}'
        GIT_TOKEN: '${{ inputs.git_token }}'
        GITHUB_MCP_URL: 'https://api.githubcopilot.com/mcp/'
        REPOSITORY: '${{ github.repository }}'
        BASE_REF: '${{ steps.pr.outputs.base }}'
        HEAD_SHA: '${{ steps.pr.outputs.head }}'
        ACTION_PATH: '${{ github.action_path }}'
        AGENT: 'antigravity-preview-09-2026'
        POLL_SECONDS: '15'
        TIMEOUT_SECONDS: '${{ inputs.timeout_seconds }}'
      run: |-
        umask 077
        request_file="${RUNNER_TEMP}/agent-request-${MODE}.json"
        interaction_file="${RUNNER_TEMP}/agent-interaction-${MODE}.json"
        reply_file="${RUNNER_TEMP}/agent-reply-${MODE}.md"
        interaction_id=''
        finished='no'
        child_pid=''
        # On every exit: stop a child still running, delete the request file, which holds the
        # tokens, and the raw interaction, and cancel a run that was started and has not reached
        # a final status (error, timeout, cancelled job). The request file is written and
        # deleted inside this one step. The cancel is kept short: a cancelled job gets about
        # ten seconds from the runner before it is killed.
        cleanup() {
          if [[ -n "${child_pid}" ]]; then
            kill "${child_pid}" 2> /dev/null || true
          fi
          if [[ -z "${interaction_id}" && "${finished}" != 'yes' && -s "${start_file:-}" ]]; then
            late_id="$(tr -d '"[:space:]' < "${start_file}")"
            if [[ "${late_id}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              interaction_id="${late_id}"
            fi
          fi
          rm -f "${request_file}" "${interaction_file}" "${start_file:-}"
          if [[ -n "${interaction_id}" && "${finished}" != 'yes' ]]; then
            echo 'Cancelling the unfinished agent run.'
            timeout 8 gemini-api agent cancel "${interaction_id}" || true
          fi
        }
        trap cleanup EXIT
        # The runner cancels a step with SIGINT, then SIGTERM. Bash runs a trap only between
        # commands, so the waits below run their command in the background and `wait` for it:
        # the signal then ends the step at once and leaves the whole grace period to cleanup.
        trap 'exit 130' INT
        trap 'exit 143' TERM

        if [[ -z "${GEMINI_API_KEY}" ]]; then
          echo '::error::gemini_api_key is empty. The agent engine needs a Gemini API key.'
          exit 1
        fi
        # No leading zero (bash would read it as octal), and no shorter than the 120 seconds the
        # start request itself may take.
        if [[ ! "${TIMEOUT_SECONDS}" =~ ^[1-9][0-9]{2,5}$ ]] || (( TIMEOUT_SECONDS < 120 )); then
          echo "::error::timeout_seconds must be a whole number of seconds from 120 to 999999, got '${TIMEOUT_SECONDS}'."
          exit 1
        fi

        git_auth="$(printf 'x-access-token:%s' "${GIT_TOKEN}" | base64 -w 0)"
        echo "::add-mask::${git_auth}"
        export GIT_AUTH="${git_auth}"
        export COMMANDS_DIR="${ACTION_PATH}/../../.github/commands"
        export REQUEST_FILE="${request_file}"
        # A merge-only command hands over no review summary. On the direct merge path the builder
        # then looks in this listing for the review account's standing approval of the head
        # commit. Only that case lists the reviews, and a listing that fails or takes too long
        # costs only the direct path. The variable is set here and nowhere else.
        export REVIEWS_FILE=''
        if [[ "${MODE}" == 'merge' && "${MERGE_PATH}" == 'direct' && -n "${REVIEWER_LOGIN}" ]] \
          && jq -e '.review_summary | type == "string" and test("^\\s*$")' "${CONTEXT_FILE}" > /dev/null 2>&1; then
          reviews_file="${RUNNER_TEMP}/agent-reviews-${MODE}.json"
          if timeout 60 gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/reviews?per_page=100" --paginate --slurp > "${reviews_file}"; then
            export REVIEWS_FILE="${reviews_file}"
          else
            echo '::warning::Could not list the pull request reviews; this merge repeats the review.'
          fi
        fi
        python3 -I "${ACTION_PATH}/build_request.py"
        # Nothing after this point needs the GitHub tokens.
        unset GH_TOKEN GIT_TOKEN GIT_AUTH git_auth

        # Lifecycle, kept deliberately simple:
        # - Every wait (start request, sleep, status request) runs in the background and is
        #   waited for, so a cancel signal ends the step at once and cleanup runs.
        # - The step polls until timeout_seconds have passed, then makes one last status
        #   request. Each request is capped at 30 seconds, so the step gives up at most about
        #   30 seconds after timeout_seconds. The job timeout must leave room for that.
        # - A run whose start request was interrupted before it returned an ID cannot be
        #   cancelled from here. The token ceiling in the request bounds its cost, and it loses
        #   GitHub once the job ends: the job token expires with the job, and an App token is
        #   revoked by the post step of the action that minted it.
        started="$(date +%s)"
        deadline="$(( started + TIMEOUT_SECONDS ))"
        start_file="${RUNNER_TEMP}/agent-start-${MODE}.txt"
        start_rc=0
        timeout 120 gemini-api agent run \
          --agent "${AGENT}" \
          --body "@${request_file}" \
          --background --stream=false --output-format json --jq '.id // empty' > "${start_file}" &
        child_pid="$!"
        wait "${child_pid}" || start_rc="$?"
        child_pid=''
        rm -f "${request_file}"
        raw_id="$(tr -d '"[:space:]' < "${start_file}")"
        if [[ "${raw_id}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
          interaction_id="${raw_id}"
        fi
        # Read once: from here on cleanup must not pick the file up again.
        rm -f "${start_file}"
        if (( start_rc != 0 )) || [[ -z "${interaction_id}" ]]; then
          # A start request that failed after returning an ID keeps it, so cleanup cancels the run.
          echo "::error::The agent run did not start cleanly (exit ${start_rc})."
          exit 1
        fi
        echo "Interaction: ${interaction_id}"

        # Everything read from the API below is treated as possibly malformed: an unreadable
        # poll is retried, and no formatting of the result can fail a run that completed.
        status='in_progress'
        i=0
        while true; do
          i="$(( i + 1 ))"
          nap="$(( deadline - $(date +%s) ))"
          if (( nap > POLL_SECONDS )); then
            nap="${POLL_SECONDS}"
          fi
          if (( nap > 0 )); then
            sleep "${nap}" &
            child_pid="$!"
            wait "${child_pid}" || true
            child_pid=''
          fi
          # The CLI exits non-zero both when the request fails and when the run itself ended as
          # failed or cancelled, so the exit status alone decides nothing: a readable status in
          # the output is used, and only an unreadable one is retried.
          poll_rc=0
          timeout 30 gemini-api agent status "${interaction_id}" \
            --stream=false --output-format json > "${interaction_file}" &
          child_pid="$!"
          wait "${child_pid}" || poll_rc="$?"
          child_pid=''
          polled="$(jq -r '.status | strings' "${interaction_file}" 2> /dev/null || true)"
          if [[ "${polled}" =~ ^[a-z_]+$ ]]; then
            status="${polled}"
            echo "Poll ${i}: ${status}"
          else
            status='unknown'
            echo "::warning::Status poll ${i} gave no readable status (exit ${poll_rc})."
          fi
          case "${status}" in
            in_progress | queued | unknown) ;;
            *) break ;;
          esac
          if (( $(date +%s) >= deadline )); then
            break
          fi
        done

        case "${status}" in
          in_progress | queued | unknown)
            echo "::error::The agent did not finish within ${TIMEOUT_SECONDS} seconds (last status: ${status})."
            exit 1
            ;;
          completed | failed | cancelled | incomplete | budget_exceeded) finished='yes' ;;
          # Any other status is treated as unfinished: the exit trap cancels the run.
          *) ;;
        esac

        seconds="$(( $(date +%s) - started ))"
        usage="$(jq -c '.usage // {} | {total_tokens, total_input_tokens, total_cached_tokens, total_output_tokens, total_thought_tokens}' "${interaction_file}" 2> /dev/null || echo '{}')"
        steps="$(jq -c '[.steps[]? | (.type // "unknown" | tostring)] | group_by(.) | map({(.[0]): length}) | add // {}' "${interaction_file}" 2> /dev/null || echo '{}')"
        echo "Agent ${MODE} on ${MODEL}: ${status} in ${seconds}s"
        echo "Usage: ${usage}"
        echo "Steps: ${steps}"
        echo 'Sandbox tool calls:'
        jq -r '.steps[]? | select(.type == "function_call") | "  \(.name // "?"): \(.arguments // {} | tostring | .[0:240])"' "${interaction_file}" || true
        echo 'Sandbox commands:'
        jq -r '.steps[]? | select(.type == "code_execution_call") | "  \(del(.type, .id, .signature) | tostring | .[0:300])"' "${interaction_file}" || true
        echo 'GitHub tool calls:'
        jq -r '.steps[]? | select(.type == "mcp_server_tool_call") | "  \(.name) \(.arguments.method // "") \(.arguments.event // "") #\(.arguments.pullNumber // "")"' "${interaction_file}" || true
        echo 'GitHub tool results:'
        jq -r '.steps[]? | select(.type == "mcp_server_tool_result") | "  \(.name): \(.result | tostring | .[0:160])"' "${interaction_file}" || true
        {
          echo "### Agent ${MODE} (\`${MODEL}\`)"
          echo "- Status: \`${status}\` in ${seconds}s"
          echo "- Usage: \`${usage}\`"
          echo "- Steps: \`${steps}\`"
        } >> "${GITHUB_STEP_SUMMARY}"

        # The reply is the text of the last model output that has any.
        jq -r '
          [.steps[]? | select(.type == "model_output")
            | [.content[]? | select(.type == "text") | .text] | join("")
            | select(length > 0)] | last // ""
        ' "${interaction_file}" > "${reply_file}" || : > "${reply_file}"
        {
          echo "status=${status}"
          echo "reply_file=${reply_file}"
        } >> "${GITHUB_OUTPUT}"

        if [[ "${status}" != 'completed' ]]; then
          echo "::error::The agent run ended as '${status}'."
          jq '{id, status, errors, error, usage}' "${interaction_file}" || true
          exit 1
        fi
        echo '--- agent reply ---'
        cat "${reply_file}"
