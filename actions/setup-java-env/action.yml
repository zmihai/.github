name: 'Setup Java Environment'
description: 'Setup Java (Temurin) with Maven/Gradle auto-detection, dependency caching and resolution'
author: 'zmihai'

inputs:
  java-version:
    description: 'Java version to use'
    required: false
    default: '21'
  distribution:
    description: 'JDK distribution (temurin, zulu, corretto, etc.)'
    required: false
    default: 'temurin'
  install-dependencies:
    description: 'Automatically resolve/download dependencies'
    required: false
    default: 'true'
  working-directory:
    description: 'Working directory'
    required: false
    default: '.'
  system-packages:
    description: 'Comma- or space-separated apt packages to install before building (e.g. "protobuf-compiler" for protoc)'
    required: false
    default: ''

outputs:
  build-tool:
    description: 'Detected build tool (maven or gradle)'
    value: ${{ steps.detect.outputs.tool }}

runs:
  using: 'composite'
  steps:
    - name: Detect build tool
      id: detect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        # hashFiles() in the cache keys below matches relative to the workspace
        # root, so a subdirectory project needs its working directory baked
        # into each glob as a prefix ('.' means the workspace root, no prefix).
        if [ "$WORKING_DIRECTORY" = "." ]; then
          echo "prefix=" >> "$GITHUB_OUTPUT"
        else
          echo "prefix=$WORKING_DIRECTORY/" >> "$GITHUB_OUTPUT"
        fi
        if [ -f pom.xml ]; then
          echo "tool=maven" >> "$GITHUB_OUTPUT"
          echo "Detected Maven project (pom.xml)."
        elif [ -f build.gradle ] || [ -f build.gradle.kts ] || [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
          echo "tool=gradle" >> "$GITHUB_OUTPUT"
          echo "Detected Gradle project."
        else
          echo "::error::No supported Java build tool found in '$WORKING_DIRECTORY'. Expected pom.xml, build.gradle(.kts), or settings.gradle(.kts)."
          exit 1
        fi

    - name: Install system packages
      if: ${{ inputs.system-packages != '' }}
      shell: bash
      env:
        SYSTEM_PACKAGES: ${{ inputs.system-packages }}
      run: |
        # Split on commas and whitespace, then validate each token before
        # passing it to apt-get as data.
        if [[ "$SYSTEM_PACKAGES" == *$'\n'* || "$SYSTEM_PACKAGES" == *$'\r'* ]]; then
          echo "::error::system-packages must be a single comma- or space-separated line."
          exit 1
        fi

        IFS=$' \t,' read -r -a raw_packages <<< "$SYSTEM_PACKAGES"
        packages=()

        for package in "${raw_packages[@]}"; do
          if [[ -z "$package" ]]; then
            continue
          fi
          if [[ "$package" == -* || ! "$package" =~ ^[a-z0-9][a-z0-9.+-]*$ ]]; then
            echo "::error::Invalid system package name '$package'. Use apt package names containing only lowercase letters, numbers, dots, plus signs, and hyphens."
            exit 1
          fi
          packages+=("$package")
        done

        if [ "${#packages[@]}" -eq 0 ]; then
          echo "::error::system-packages was provided but no valid package names were found."
          exit 1
        fi

        printf 'Installing system packages:'
        printf ' %s' "${packages[@]}"
        printf '\n'
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends -- "${packages[@]}"

    - name: Setup Java
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # ratchet:actions/setup-java@v5
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}

    # Explicit actions/cache steps instead of setup-java's built-in cache: that
    # cache keys on an exact hash of the build files and deliberately sets no
    # restore-keys (actions/setup-java#269), so any PR that touches a build
    # file — every dependency bump — misses outright and re-downloads the full
    # dependency set cold. Both local stores are content-addressed by artifact
    # coordinates, so restoring a stale cache is safe: the build fetches only
    # what changed and the post-job save stores it under the new key. The
    # hashFiles globs mirror setup-java's own defaults per build tool.
    - name: Cache Maven repository
      if: ${{ steps.detect.outputs.tool == 'maven' }}
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # ratchet:actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles(format('{0}**/pom.xml', steps.detect.outputs.prefix)) }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Cache Gradle dependencies
      if: ${{ steps.detect.outputs.tool == 'gradle' }}
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # ratchet:actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles(format('{0}**/*.gradle*', steps.detect.outputs.prefix), format('{0}**/gradle-wrapper.properties', steps.detect.outputs.prefix), format('{0}buildSrc/**/Versions.kt', steps.detect.outputs.prefix), format('{0}buildSrc/**/Dependencies.kt', steps.detect.outputs.prefix), format('{0}gradle/*.versions.toml', steps.detect.outputs.prefix), format('{0}**/versions.properties', steps.detect.outputs.prefix)) }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Make Gradle wrapper executable
      if: ${{ steps.detect.outputs.tool == 'gradle' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

    - name: Resolve dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # Best-effort warmup so dependencies are cached. Real resolution errors
        # surface during the build/test step, so a hiccup here is non-fatal.
        if [ "${{ steps.detect.outputs.tool }}" = "maven" ]; then
          mvn -B -ntp dependency:go-offline \
            || echo "::warning::Maven dependency:go-offline reported issues; continuing (dependencies will resolve during build)."
        elif [ "${{ steps.detect.outputs.tool }}" = "gradle" ]; then
          GRADLE="gradle"; [ -f ./gradlew ] && GRADLE="./gradlew"
          $GRADLE --no-daemon dependencies \
            || echo "::warning::Gradle dependency resolution reported issues; continuing (dependencies will resolve during build)."
        fi

branding:
  icon: 'coffee'
  color: 'orange'
