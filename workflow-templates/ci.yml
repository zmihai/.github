name: CI

on:
  push:
    branches: [$default-branch, develop]
  pull_request:
    branches: [$default-branch, develop]

# The called workflow's ref-resolution job requests these reads, and GitHub
# validates nested permissions requests against this grant at startup — repos
# whose default token is contents-read-only startup-fail without the block.
permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  ci:
    uses: zmihai/.github/.github/workflows/reusable-ci.yml@v0.12.4
    with:
      # Supported languages: javascript, python, php, java.
      # Adjust language and language-version to match your project,
      # e.g. python/'3.11', php/'8.4', java/'21'.
      language: 'javascript'
      language-version: '20'
      run-lint: true
      run-test: true
      run-build: true
      build-before-test: false
