name: Security Scan

on:
  push:
    branches: [$default-branch]
  pull_request:
    branches: [$default-branch]
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security:
    uses: zmihai/.github/.github/workflows/reusable-security-scan.yml@v0.9.3
    with:
      scan-dependencies: true
      scan-code: false
      # For Python projects, change language to 'python' and language-version to e.g. '3.11'
      # For PHP projects, change language to 'php' and language-version to e.g. '8.4'
      language: 'javascript'
      language-version: '20'
