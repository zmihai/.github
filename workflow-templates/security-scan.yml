name: Security Scan

on:
  push:
    branches: [$default-branch]
  pull_request:
    branches: [$default-branch]
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'

# The called workflow's ref-resolution job requests these reads, and GitHub
# validates nested permissions requests against this grant at startup — repos
# whose default token is contents-read-only startup-fail without the block.
# Enabling CodeQL (scan-code: true below) additionally requires:
#   security-events: write + actions: read
permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  security:
    uses: zmihai/.github/.github/workflows/reusable-security-scan.yml@v0.12.2
    with:
      scan-dependencies: true
      scan-code: false
      # Dependency scanning supports: javascript, python, php, java.
      # CodeQL (scan-code) also supports additional languages:
      # https://docs.github.com/code-security/code-scanning/managing-your-code-scanning-configuration/supported-languages-and-frameworks
      # Adjust language and language-version to match your project,
      # e.g. python/'3.11', php/'8.4', java/'21'.
      language: 'javascript'
      language-version: '20'
