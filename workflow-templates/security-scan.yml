name: Security Scan

on:
  push:
    branches: [$default-branch]
  pull_request:
    branches: [$default-branch]
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security:
    uses: zmihai/.github/.github/workflows/reusable-security-scan.yml@v0.11.0
    with:
      scan-dependencies: true
      scan-code: false
      # Dependency scanning supports: javascript, python, php, java.
      # CodeQL (scan-code) also supports additional languages:
      # https://docs.github.com/code-security/code-scanning/managing-your-code-scanning-configuration/supported-languages-and-frameworks
      # Adjust language and language-version to match your project,
      # e.g. python/'3.11', php/'8.4', java/'21'.
      language: 'javascript'
      language-version: '20'
