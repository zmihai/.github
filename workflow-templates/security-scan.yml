name: Security Scan

on:
  push:
    branches: [$default-branch]
  pull_request:
    branches: [$default-branch]
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security:
    uses: zmihai/.github/.github/workflows/reusable-security-scan.yml@v0.10.0
    with:
      scan-dependencies: true
      scan-code: false
      # Supported languages: javascript, python, php, java.
      # Adjust language and language-version to match your project,
      # e.g. python/'3.11', php/'8.4', java/'21'.
      language: 'javascript'
      language-version: '20'
